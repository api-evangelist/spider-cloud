apis:
- aid: spider-cloud:spider-mcp
  name: Spider Cloud MCP Server
  description: >-
    Spider's hosted Model Context Protocol server exposes 22 tools — eight core operations (crawl, scrape,
    search, links, screenshot, unblocker, transform, get_credits), five AI-routed variants, and nine browser-automation
    tools (open, navigate, click, fill, screenshot, content, evaluate, wait_for, close) — to any MCP-compatible
    client. Authenticated with a Bearer API key. Also runnable locally via `npx spider-cloud-mcp`.
  humanURL: https://spider.cloud/docs/integrations/mcp
  baseURL: https://mcp.spider.cloud/mcp
