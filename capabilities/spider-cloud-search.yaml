naftiko: 1.0.0-alpha2
info:
  label: Spider Cloud API — Search and Links
  description: 'Spider Cloud API — Search and Links. Run web searches with optional page-content retrieval
    and collect every link from a website. Self-contained Naftiko capability covering the discovery business
    surface.'
  tags:
    - Spider Cloud
    - Search
    - Links
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      SPIDER_CLOUD_API_KEY: SPIDER_CLOUD_API_KEY
capability:
  consumes:
    - type: http
      namespace: spider-cloud-search
      baseUri: https://api.spider.cloud
      description: Spider Cloud API — Search and Links business capability. Self-contained, no shared
        references.
      resources:
        - name: search
          path: /search
          operations:
            - name: search
              method: POST
              description: Run a web search query and optionally crawl the returned results.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
              inputParameters:
                - name: body
                  in: body
                  type: object
                  description: Request body (JSON).
                  required: true
        - name: links
          path: /links
          operations:
            - name: links
              method: POST
              description: Collect every link from a website without scraping page content.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
              inputParameters:
                - name: body
                  in: body
                  type: object
                  description: Request body (JSON).
                  required: true
      authentication:
        type: bearer
        token: '{{env.SPIDER_CLOUD_API_KEY}}'
  exposes:
    - type: rest
      namespace: spider-cloud-search-rest
      port: 8080
      description: REST adapter for Spider Cloud API — Search and Links.
      resources:
        - path: /v1/search
          name: search
          description: REST surface for search.
          operations:
            - method: POST
              name: search
              description: Run a web search query and optionally crawl the returned results.
              call: spider-cloud-search.search
              with:
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/links
          name: links
          description: REST surface for links.
          operations:
            - method: POST
              name: links
              description: Collect every link from a website.
              call: spider-cloud-search.links
              with:
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: spider-cloud-search-mcp
      port: 9090
      transport: http
      description: MCP adapter for Spider Cloud API — Search and Links.
      tools:
        - name: web-search
          description: Run a web search query and optionally crawl the returned results.
          hints:
            readOnly: true
            destructive: false
            idempotent: false
          call: spider-cloud-search.search
          with:
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
        - name: collect-links
          description: Collect every link from a website without scraping page content.
          hints:
            readOnly: true
            destructive: false
            idempotent: false
          call: spider-cloud-search.links
          with:
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
